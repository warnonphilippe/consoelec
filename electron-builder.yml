# Packaging de l'application de bureau :
#   macOS   : ./release/build.sh      (ou npm run dist:mac)
#   Windows : ./release/build-win.sh  (ou npm run dist:win)
appId: io.github.warnonphilippe.consoelec
productName: ConsoElec
artifactName: consoelec-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

# esbuild embarque déjà tout le front dans dist/ ; le process principal n'a aucune dépendance
# (Angular, Chart.js… sont en devDependencies et ne sont donc pas empaquetés).
files:
  - dist/consoelec/browser/**/*
  - dist-electron/**/*.js
  - package.json
asar: true
# Aucun module natif à recompiler pour Electron.
npmRebuild: false
# Avant la signature : UUID Mach-O propre à l'app, sans quoi macOS confond l'autorisation « Réseau local » de
# toutes les apps Electron de même version (voir scripts/mac-uuid.mjs).
afterPack: ./scripts/mac-uuid.mjs

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.utilities
  icon: build/icon.icns
  # Par défaut : signature ad hoc, indispensable pour qu'une app arm64 se lance. Sur un autre Mac, lever la
  # quarantaine (voir le guide). release/build.sh signe plutôt avec le certificat « Apple Development » du
  # trousseau quand il existe : une identité stable garde l'autorisation « Réseau local » d'une version à l'autre
  # (une signature ad hoc change à chaque build et macOS la redemande).
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    # Lecture de l'onduleur sur le réseau local et recherche Bonjour (macOS 15 demande l'autorisation).
    NSLocalNetworkUsageDescription: Lire la production de votre onduleur solaire sur le réseau local.
    NSBonjourServices:
      - _http._tcp

dmg:
  title: ConsoElec ${version}

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  # Pas de certificat de signature de code : Windows SmartScreen affichera un avertissement (voir le guide).
  signAndEditExecutable: true

nsis:
  # Installation par utilisateur, sans droits administrateur.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ConsoElec
