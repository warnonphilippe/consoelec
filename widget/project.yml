# Projet Xcode des widgets de ConsoElec (Mac et iPhone), généré par XcodeGen : `xcodegen generate`
# (voir build.sh et build-ios.sh).
name: ConsoElecWidget
options:
  bundleIdPrefix: io.github.warnonphilippe
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  developmentLanguage: fr
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
packages:
  SmaKit:
    path: SmaKit
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  ConsoElecWidget:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - package: SmaKit
      - target: ConsoElecWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.warnonphilippe.consoelec.widget
        PRODUCT_NAME: ConsoElec Widget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ConsoElec Widget
        ConsoElecAppGroup: $(TeamIdentifierPrefix)group.io.github.warnonphilippe.consoelec
        ConsoElecKeychainGroup: $(AppIdentifierPrefix)io.github.warnonphilippe.consoelec.shared
        NSLocalNetworkUsageDescription: Lire la production de votre onduleur solaire et votre compteur électrique (lecteur P1) sur le réseau local.
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        NSBonjourServices: [_http._tcp, _hwenergy._tcp]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)group.io.github.warnonphilippe.consoelec]
        keychain-access-groups: [$(AppIdentifierPrefix)io.github.warnonphilippe.consoelec.shared]
  ConsoElecWidgetExtension:
    type: app-extension
    platform: macOS
    sources: [Extension, Shared]
    dependencies:
      - package: SmaKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.warnonphilippe.consoelec.widget.extension
        PRODUCT_NAME: ConsoElecWidgetExtension
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: ConsoElec
        ConsoElecAppGroup: $(TeamIdentifierPrefix)group.io.github.warnonphilippe.consoelec
        ConsoElecKeychainGroup: $(AppIdentifierPrefix)io.github.warnonphilippe.consoelec.shared
        NSLocalNetworkUsageDescription: Lire la production de votre onduleur solaire et votre compteur électrique (lecteur P1) sur le réseau local.
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        NSBonjourServices: [_http._tcp, _hwenergy._tcp]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Extension/Extension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)group.io.github.warnonphilippe.consoelec]
        keychain-access-groups: [$(AppIdentifierPrefix)io.github.warnonphilippe.consoelec.shared]
  # iPhone : sur iOS, un groupe d'apps s'écrit « group.… », sans préfixe d'équipe.
  ConsoElecPhone:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, App.entitlements]
      - Shared
    dependencies:
      - package: SmaKit
      - target: ConsoElecPhoneWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.warnonphilippe.consoelec.phone
        PRODUCT_NAME: ConsoElec
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: iOS/App-Info.plist
      properties:
        CFBundleDisplayName: ConsoElec
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ConsoElecAppGroup: group.io.github.warnonphilippe.consoelec
        ConsoElecKeychainGroup: $(AppIdentifierPrefix)io.github.warnonphilippe.consoelec.shared
        NSLocalNetworkUsageDescription: Lire la production de votre onduleur solaire et votre compteur électrique (lecteur P1) sur le Wi-Fi de la maison.
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        NSBonjourServices: [_http._tcp, _hwenergy._tcp]
    entitlements:
      path: iOS/App.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.warnonphilippe.consoelec]
        keychain-access-groups: [$(AppIdentifierPrefix)io.github.warnonphilippe.consoelec.shared]
  ConsoElecPhoneWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
        excludes: [Info.plist, Extension.entitlements]
      - Shared
    dependencies:
      - package: SmaKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.warnonphilippe.consoelec.phone.widget
        PRODUCT_NAME: ConsoElecPhoneWidget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iOS/Widget-Info.plist
      properties:
        CFBundleDisplayName: ConsoElec
        ConsoElecAppGroup: group.io.github.warnonphilippe.consoelec
        ConsoElecKeychainGroup: $(AppIdentifierPrefix)io.github.warnonphilippe.consoelec.shared
        NSLocalNetworkUsageDescription: Lire la production de votre onduleur solaire et votre compteur électrique (lecteur P1) sur le Wi-Fi de la maison.
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        NSBonjourServices: [_http._tcp, _hwenergy._tcp]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: iOS/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.warnonphilippe.consoelec]
        keychain-access-groups: [$(AppIdentifierPrefix)io.github.warnonphilippe.consoelec.shared]
  SmaKitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - package: SmaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.warnonphilippe.consoelec.widget.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ConsoElecWidget:
    build:
      targets:
        ConsoElecWidget: all
    test:
      targets: [SmaKitTests]
  ConsoElecPhone:
    build:
      targets:
        ConsoElecPhone: all
