<div class="card">
  <div class="card-header">
    <h2>Graphique des soldes</h2>
    <div class="row">
      <div class="segmented" role="radiogroup" aria-label="Historique des soldes">
        @for (o of historyOptions; track o.label) {
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="balanceHistoryDays() === o.days"
            [class.active]="balanceHistoryDays() === o.days"
            (click)="balanceHistoryDays.set(o.days)"
          >
            {{ o.label }}
          </button>
        }
      </div>
      <div class="segmented" role="radiogroup" aria-label="Prévision des soldes">
        @for (o of forecastOptions; track o.label) {
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="balanceForecastDays() === o.days"
            [class.active]="balanceForecastDays() === o.days"
            (click)="balanceForecastDays.set(o.days)"
          >
            {{ o.label }}
          </button>
        }
      </div>
    </div>
  </div>
  @if (store.billing().history.length > 0) {
    <app-chart [build]="balanceChart()" [height]="360" />
  } @else {
    <p class="small muted">Encodez au moins deux relevés pour calculer les soldes.</p>
  }
</div>
